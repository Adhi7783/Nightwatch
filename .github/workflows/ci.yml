name: Nightwatch validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked SDK and build dependencies
        run: npm ci --no-audit --no-fund
      - name: Test deterministic game rules
        run: npm run test:rules
      - name: Validate TypeScript and build
        run: npm run build
      - name: Build isolated visual fixture
        run: npx vite build --config tests/visual-preview/vite.config.ts
      - name: Preserve compiled Worker and web assets
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-build
          path: |
            sdk/dist
            sdk/.wrangler/deploy
            sdk/package-lock.json
          include-hidden-files: true
