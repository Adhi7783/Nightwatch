<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Nightwatch</title><desc id="desc">A cooperative detective game. Black and blue command interface with an original orbital instrument.</desc><defs><radialGradient id="glow"><stop stop-color="#103954"/><stop offset="1" stop-color="#02080e"/></radialGradient></defs><rect width="1280" height="360" rx="16" fill="#02080e"/><rect x="1" y="1" width="1278" height="358" rx="16" fill="none" stroke="#264c68"/><circle cx="1020" cy="180" r="175" fill="url(#glow)"/><g stroke="#64beff" fill="none" opacity=".65" transform="translate(1020 180)"><circle r="108"/><ellipse rx="114" ry="37" transform="rotate(-38)"/><ellipse rx="114" ry="37" transform="rotate(55)"/><ellipse rx="114" ry="37" transform="rotate(4)"/><circle r="24"/><path d="M0 -28L28 0 0 28 -28 0Z M-140 0H-124 M124 0H140 M0 -140V-124 M0 124V140"/><circle r="140" stroke-dasharray="3 14" opacity=".45"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="88" fill="#5896be" font-size="13" letter-spacing="5">CASE 001 / BELLWETHER MUSEUM</text><text x="66" y="170" fill="#a2d9ff" font-size="64" font-weight="600" letter-spacing="10">NIGHTWATCH</text><text x="70" y="223" fill="#c5ddeb" font-size="23">Follow the evidence. Build the case.</text><text x="70" y="286" fill="#6698b9" font-size="14" letter-spacing="2">PRIVATE ROOMS · SHARED EVIDENCE · ONE ORIGINAL MYSTERY</text></g></svg>